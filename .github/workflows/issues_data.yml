name: Issues Data

on:
  schedule:
    - cron: '0 * * * *' # run hourly
  workflow_dispatch: # allow manual triggering

permissions:
  contents: write

jobs:
  fetch-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Fetch issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOS=(
            "andrewgjohnson/AgjGd"
            "andrewgjohnson/imageblendedcolorallocate"
            "andrewgjohnson/imagecolorallocatefromstring"
            "andrewgjohnson/imagegradientrectangle"
            "andrewgjohnson/imagettftextblur"
            "andrewgjohnson/imagettftextgradient"
            "andrewgjohnson/linebreaks4imagettftext"
          )

          # Load previous values so a transient API failure preserves them.
          declare -A PREV_ISSUES
          if [ -f data/issues.json ]; then
            while IFS=$'\t' read -r repo issues; do
              PREV_ISSUES["$repo"]=$issues
            done < <(jq -r '.repositories[] | "\(.repository)\t\(.openIssues)"' data/issues.json)
          fi

          REPO_ISSUES=()
          FAILED=0

          for REPO in "${REPOS[@]}"; do
            RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO")
            OPEN_ISSUES=$(echo "$RESPONSE" | jq '.open_issues_count')
            if [[ "$OPEN_ISSUES" =~ ^[0-9]+$ ]]; then
              REPO_ISSUES+=("$REPO $OPEN_ISSUES")
            else
              MESSAGE=$(echo "$RESPONSE" | jq -r '.message // "unexpected response"' 2>/dev/null || echo "unexpected response")
              echo "::warning::Failed to fetch issues for $REPO: $MESSAGE"
              PREV=${PREV_ISSUES["$REPO"]:-0}
              echo "Preserving previous value for $REPO: $PREV"
              REPO_ISSUES+=("$REPO $PREV")
              FAILED=$((FAILED + 1))
            fi
          done

          IFS=$'\n' SORTED=($(sort -k1,1 <<<"${REPO_ISSUES[*]}"))
          unset IFS

          REPO_JSON_ITEMS=()
          for ENTRY in "${SORTED[@]}"; do
            REPO=$(echo $ENTRY | awk '{print $1}')
            OPEN_ISSUES=$(echo $ENTRY | awk '{print $2}')
            ITEM=$(jq -n \
              --arg repository "$REPO" \
              --argjson openIssues "$OPEN_ISSUES" \
              '{repository: $repository, openIssues: $openIssues}')
            REPO_JSON_ITEMS+=("$ITEM")
          done

          mkdir -p data
          printf '%s\n' "${REPO_JSON_ITEMS[@]}" | jq -s '{repositories: .}' > data/issues.json

          echo "Wrote data/issues.json:"
          cat data/issues.json

          echo "FAILED_REPOS=$FAILED" >> "$GITHUB_ENV"

      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/issues.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update issues data"

          for ATTEMPT in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $ATTEMPT); rebasing on latest master and retrying"
            git pull --rebase origin master
          done
          echo "::error::Failed to push after multiple attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if any repositories could not be fetched
        if: always()
        run: |
          if [ "${FAILED_REPOS:-0}" -gt 0 ]; then
            echo "::error::$FAILED_REPOS repositor(y/ies) could not be fetched; their previous values were preserved."
            exit 1
          fi

name: Stargazers Data

on:
  schedule:
    - cron: '0 * * * *' # run hourly
  workflow_dispatch: # allow manual triggering

permissions:
  contents: write

jobs:
  fetch-stargazers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Fetch stargazers
        env:
          GITHUB_TOKEN: ${{ secrets.STARGAZERS_TOKEN }}
        run: |
          REPOS=(
            "andrewgjohnson/AgjGd"
            "andrewgjohnson/imageblendedcolorallocate"
            "andrewgjohnson/imagecolorallocatefromstring"
            "andrewgjohnson/imagegradientrectangle"
            "andrewgjohnson/imagettftextblur"
            "andrewgjohnson/imagettftextgradient"
            "andrewgjohnson/linebreaks4imagettftext"
          )

          # Load the previously recorded values so a transient API failure preserves them
          # instead of overwriting good data with zeros.
          declare -A PREV_STARS
          PREV_UNIQUE=0
          if [ -f data/stargazers.json ]; then
            while IFS=$'\t' read -r repo stars; do
              PREV_STARS["$repo"]=$stars
            done < <(jq -r '.repositories[] | "\(.repository)\t\(.stargazers)"' data/stargazers.json)
            PREV_UNIQUE=$(jq -r '.uniqueStargazers // 0' data/stargazers.json)
          fi

          declare -A SEEN
          REPO_STARGAZERS=()
          FAILED=0

          for REPO in "${REPOS[@]}"; do
            PAGE=1
            STARGAZERS=0
            FETCH_FAILED=false
            while true; do
              RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/stargazers?per_page=100&page=$PAGE")
              if echo "$RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1; then
                COUNT=$(echo "$RESPONSE" | jq 'length')
                if [ "$COUNT" -eq 0 ]; then
                  break
                fi
                for ID in $(echo "$RESPONSE" | jq '.[].id'); do
                  STARGAZERS=$((STARGAZERS + 1))
                  SEEN[$ID]=1
                done
                # per_page is 100, so a short page means this was the last one.
                if [ "$COUNT" -lt 100 ]; then
                  break
                fi
                PAGE=$((PAGE + 1))
              else
                MESSAGE=$(echo "$RESPONSE" | jq -r '.message // "unexpected response"' 2>/dev/null || echo "unexpected response")
                echo "::warning::Failed to fetch stargazers for $REPO: $MESSAGE"
                FETCH_FAILED=true
                break
              fi
            done

            if [ "$FETCH_FAILED" = true ]; then
              PREV=${PREV_STARS["$REPO"]:-0}
              echo "Preserving previous value for $REPO: $PREV"
              REPO_STARGAZERS+=("$REPO $PREV")
              FAILED=$((FAILED + 1))
            else
              REPO_STARGAZERS+=("$REPO $STARGAZERS")
            fi
          done

          # Sort by repository name so the report renders in a stable order.
          IFS=$'\n' SORTED=($(sort -k1,1 <<<"${REPO_STARGAZERS[*]}"))
          unset IFS

          REPO_JSON_ITEMS=()
          for ENTRY in "${SORTED[@]}"; do
            REPO=$(echo $ENTRY | awk '{print $1}')
            STARGAZERS=$(echo $ENTRY | awk '{print $2}')
            ITEM=$(jq -n \
              --arg repository "$REPO" \
              --argjson stargazers "$STARGAZERS" \
              '{repository: $repository, stargazers: $stargazers}')
            REPO_JSON_ITEMS+=("$ITEM")
          done

          # The unique count is only reliable when every repository was fetched successfully;
          # otherwise keep the previous total so a partial run does not undercount it.
          if [ "$FAILED" -eq 0 ]; then
            UNIQUE_STARGAZERS=${#SEEN[@]}
          else
            UNIQUE_STARGAZERS=$PREV_UNIQUE
          fi

          mkdir -p data
          printf '%s\n' "${REPO_JSON_ITEMS[@]}" | jq -s \
            --argjson unique "$UNIQUE_STARGAZERS" \
            '{repositories: ., uniqueStargazers: $unique}' > data/stargazers.json

          echo "Wrote data/stargazers.json:"
          cat data/stargazers.json

          echo "FAILED_REPOS=$FAILED" >> "$GITHUB_ENV"

      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/stargazers.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update stargazers data"

          # The other data workflows run on the same hourly cron and also push to master,
          # so a push can be rejected if one committed first. Rebase and retry.
          for ATTEMPT in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $ATTEMPT); rebasing on latest master and retrying"
            git pull --rebase origin master
          done
          echo "::error::Failed to push after multiple attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if any repositories could not be fetched
        if: always()
        run: |
          if [ "${FAILED_REPOS:-0}" -gt 0 ]; then
            echo "::error::$FAILED_REPOS repositor(y/ies) could not be fetched; their previous values were preserved."
            exit 1
          fi

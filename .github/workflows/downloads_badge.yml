name: Downloads Badge

on:
  workflow_run:
    workflows: ["Downloads Data"]
    types: [completed]
  workflow_dispatch: # allow manual triggering

permissions:
  contents: write

jobs:
  build-badge:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master # always read the latest committed data file

      - name: Build downloads badge
        run: |
          if [ ! -f data/downloads.json ]; then
            echo "::warning::data/downloads.json not found yet; skipping badge"
            exit 0
          fi

          TOTAL_DOWNLOADS=$(jq '[.repositories[].downloads] | add // 0' data/downloads.json)

          BADGE_URL="https://raster.shields.io/badge/downloads-"

          round() {
            echo $1 | awk '{printf "%d", ($1 + 0.5)}'
          }

          if [ $TOTAL_DOWNLOADS -ge 999500 ]; then
            BADGE_URL="${BADGE_URL}$(round $(echo "$TOTAL_DOWNLOADS / 1000000" | bc -l))M"
          elif [ $TOTAL_DOWNLOADS -ge 1000 ]; then
            BADGE_URL="${BADGE_URL}$(round $(echo "$TOTAL_DOWNLOADS / 1000" | bc -l))k"
          else
            BADGE_URL="${BADGE_URL}${TOTAL_DOWNLOADS}"
          fi

          BADGE_URL="${BADGE_URL}-0366d6.png?colorB=0366d6&style=flat-square&logoColor=white&logo=packagist"

          echo "Downloading badge from URL: $BADGE_URL"
          curl -L "$BADGE_URL" -o documentation/images/downloads-badge.png

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add documentation/images/downloads-badge.png
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update downloads badge"

          for ATTEMPT in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $ATTEMPT); rebasing on latest master and retrying"
            git pull --rebase origin master
          done
          echo "::error::Failed to push after multiple attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

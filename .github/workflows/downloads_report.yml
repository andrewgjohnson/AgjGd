name: Downloads Report

on:
  workflow_run:
    workflows: ["Downloads Data"]
    types: [completed]
  workflow_dispatch: # allow manual triggering

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master # always read the latest committed data file

      - name: Generate report
        run: |
          if [ ! -f data/downloads.json ]; then
            echo "::warning::data/downloads.json not found yet; skipping report"
            exit 0
          fi

          # Thousands separators (printf "%'d") need a UTF-8 locale.
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8

          format_number() {
            echo $1 | awk '{printf "%'\''d\n", $1}'
          }

          REPORT="Project|Downloads\n-------|----------\n"
          TOTAL_DOWNLOADS=0
          while IFS=$'\t' read -r REPO DOWNLOADS; do
            [ -z "$REPO" ] && continue
            TOTAL_DOWNLOADS=$((TOTAL_DOWNLOADS + DOWNLOADS))
            FORMATTED_DOWNLOADS=$(format_number $DOWNLOADS)
            USERNAME=$(echo "$REPO" | cut -d'/' -f1)
            REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
            REPORT+="[$USERNAME/**$REPO_NAME**](https://github.com/$REPO)|[$FORMATTED_DOWNLOADS](https://packagist.org/packages/$REPO/stats)\n"
          done < <(jq -r '.repositories[] | [.repository, (.downloads|tostring)] | @tsv' data/downloads.json)

          FORMATTED_TOTAL_DOWNLOADS=$(format_number $TOTAL_DOWNLOADS)
          REPORT+="**Total downloads across all projects**|**$FORMATTED_TOTAL_DOWNLOADS**"
          echo -e "$REPORT" > DOWNLOADS.md

          echo "Wrote DOWNLOADS.md:"
          cat DOWNLOADS.md

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add DOWNLOADS.md
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update downloads report"

          for ATTEMPT in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $ATTEMPT); rebasing on latest master and retrying"
            git pull --rebase origin master
          done
          echo "::error::Failed to push after multiple attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
